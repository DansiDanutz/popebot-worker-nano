name: Verify placeholder contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Reject executable or deployable content
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(README\.md|greptile\.json|\.gitignore|\.github/workflows/verify\.yml)$'
          unexpected="$(git ls-files | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected files violate the non-executable placeholder contract:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          grep -Fq 'intentional non-executable placeholder' README.md
          grep -Fq 'No GitHub, Vercel, or other hosted deployment is required' README.md
          jq -e '
            (keys | sort) == (["comment", "commentTypes", "instructions", "statusCheck", "strictness", "triggerOnUpdates"] | sort) and
            .statusCheck == true and
            .triggerOnUpdates == true and
            .strictness == 2
          ' greptile.json
          test "$(grep -Ec '^[[:space:]]*- uses:' .github/workflows/verify.yml)" -eq 1
          test "$(grep -Ec '^[[:space:]]*run:' .github/workflows/verify.yml)" -eq 1
          test "$(grep -Ec '^[[:space:]]*- name:' .github/workflows/verify.yml)" -eq 1
          ! grep -Eq '^  (actions|checks|deployments|id-token|packages|pull-requests|security-events|statuses):' .github/workflows/verify.yml
          secret_prefix='$'
          secret_suffix='{{ secrets.'
          ! grep -Fq "${secret_prefix}${secret_suffix}" .github/workflows/verify.yml
          if jq -r '.. | strings' greptile.json | grep -Eiq '(curl[^[:alnum:]]*\|[[:space:]]*(ba)?sh|npx[[:space:]]+vercel|npm[[:space:]]+run|bun[[:space:]]+run|docker[[:space:]]+(build|run|push)|ssh[[:space:]]|scp[[:space:]]|"?(command|script)"?[[:space:]]*:)'; then
            echo 'Executable or deployment command found in greptile.json'
            exit 1
          fi
